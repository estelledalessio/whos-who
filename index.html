<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100f">
<title>Who's Who?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--bg:#07100f;--card:#101c19;--line:#2e3a34;--cream:#f1dfbd;--text:#f7f1e6;--muted:#a9aaa4;--gold:#c9a36d;--shadow:0 20px 60px rgba(0,0,0,.28)}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(201,163,109,.14),transparent 34%),linear-gradient(180deg,#08110f,#050908 90%);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}#app{max-width:520px;margin:auto;min-height:100vh;padding:24px 20px 44px}.shell{min-height:calc(100vh - 68px);display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;min-height:42px;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}.brand{font-family:"Playfair Display",serif;font-size:18px}.iconbtn{border:1px solid var(--line);background:#0c1513;color:var(--text);border-radius:999px;width:42px;height:42px}
.hero{padding:60px 0 28px;text-align:center}.star{font-size:29px;color:var(--gold);margin-bottom:24px}h1,h2,h3{font-family:"Playfair Display",serif;font-weight:500;margin:0}h1{font-size:64px;line-height:.88;letter-spacing:-.04em}h2{font-size:34px;line-height:1.05}h3{font-size:25px}.subtitle{color:#d9d8d1;max-width:340px;margin:24px auto 0;line-height:1.55}.tagline{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-top:54px}
.card{background:linear-gradient(180deg,rgba(20,34,30,.98),rgba(11,20,18,.98));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.stack{display:grid;gap:12px}.btn{width:100%;border:0;border-radius:16px;padding:16px 18px;font-weight:700;background:var(--cream);color:#16120d;transition:.18s}.btn:active{transform:scale(.985)}.btn.secondary{background:transparent;color:var(--text);border:1px solid #6d6558}.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:grid;gap:8px}label{font-size:13px;color:#d5d1c7}input,textarea,select{width:100%;background:#0b1412;border:1px solid var(--line);border-radius:14px;padding:15px;color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:#8e7654}textarea{min-height:110px;resize:none}
.mode{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:#0d1715;border-radius:16px;padding:15px;color:var(--text)}.mode.selected{border-color:var(--gold);background:#151b17}.mode .emoji{font-size:22px;width:30px;text-align:center}.mode b{display:block;font-family:"Playfair Display",serif;font-size:18px}.mode small{color:var(--muted)}.mode.disabled{opacity:.42}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:#0d1715;color:var(--text)}.pill.selected{background:var(--cream);color:#16120d;border-color:var(--cream)}
.roomcode{font-size:34px;font-weight:700;letter-spacing:.12em;text-align:center;color:var(--cream)}.player{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #22302b}.player:last-child{border-bottom:0}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dac49e;color:#19150f;font-weight:700}.playerleft{display:flex;align-items:center;gap:12px}.score{color:var(--gold);font-weight:700}
.question{font-family:"Playfair Display",serif;font-size:30px;line-height:1.17;text-align:center;padding:38px 10px}.mask{font-size:34px;text-align:center;margin:14px 0;color:var(--cream)}.progress{height:4px;background:#27322e;border-radius:999px;overflow:hidden;margin-bottom:26px}.progress>i{display:block;height:100%;background:var(--cream)}.center{text-align:center}.muted{color:var(--muted)}.answer{padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:#0b1412;margin-top:9px}.answer .who{font-size:12px;color:var(--gold);margin-bottom:5px}
.votegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.votebtn{border:1px solid var(--line);background:#0d1715;color:var(--text);padding:15px 10px;border-radius:15px}.votebtn.selected{border-color:var(--cream);box-shadow:0 0 0 1px var(--cream) inset}.bigavatar{width:92px;height:92px;border-radius:50%;margin:22px auto 14px;display:grid;place-items:center;background:var(--cream);color:#17120d;font-size:38px;font-weight:700;box-shadow:0 0 44px rgba(241,223,189,.18)}.reveal{padding-top:42px;text-align:center}
.error,.toast{position:fixed;left:20px;right:20px;bottom:24px;max-width:480px;margin:auto;border-radius:15px;padding:14px 16px;z-index:4}.error{background:#3b201e;border:1px solid #7a4944;color:#ffd8d3}.toast{background:#18251f;border:1px solid #4b6456;color:#eef6ef}.wait{padding:48px 10px;text-align:center}.wait .dots{letter-spacing:.35em;color:var(--gold);margin:16px 0}.small{font-size:12px}.spacer{flex:1}@media(max-width:360px){h1{font-size:54px}.question{font-size:26px}}
</style></head><body><main id="app"></main><script>
const API="https://qkgxwporlkfyyojpredw.supabase.co/functions/v1/game-api";
let S={screen:"home",mode:"imposter",vibe:"everything",rounds:5,name:"",playerToken:localStorage.getItem("ww_player")||"",hostToken:localStorage.getItem("ww_host")||"",playerId:localStorage.getItem("ww_pid")||"",state:null,selectedVote:null,timer:null};
const $=s=>document.querySelector(s);
const esc=(x="")=>String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const initials=n=>(n||"?").trim().slice(0,1).toUpperCase();
function toast(msg,bad=false){const d=document.createElement("div");d.className=bad?"error":"toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function api(payload){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({error:"Invalid server response"}));if(!r.ok||j.error){toast(j.error||"Request failed",true);throw new Error(j.error||"Request failed")}return j}
function saveSession(j){if(j.player_token){S.playerToken=j.player_token;localStorage.setItem("ww_player",j.player_token)}if(j.host_token){S.hostToken=j.host_token;localStorage.setItem("ww_host",j.host_token)}if(j.player_id){S.playerId=j.player_id;localStorage.setItem("ww_pid",j.player_id)}if(j.state)S.state=j.state}
function reset(){localStorage.clear();clearInterval(S.timer);S={screen:"home",mode:"imposter",vibe:"everything",rounds:5,name:"",playerToken:"",hostToken:"",playerId:"",state:null,selectedVote:null,timer:null};render()}
function top(title="Who's Who?"){return `<div class="top"><button class="iconbtn" onclick="back()">←</button><div class="brand">${title}</div><button class="iconbtn" onclick="reset()">×</button></div>`}
function back(){clearInterval(S.timer);S.screen=S.state?"game":"home";render();if(S.state)poll()}
function home(){return `<div class="shell"><div class="hero"><div class="star">✦</div><h1>Who’s<br>Who?</h1><p class="subtitle">How well do you really know your friends?</p></div><div class="stack"><button class="btn" onclick="S.screen='create';render()">Create Game →</button><button class="btn secondary" onclick="S.screen='join';render()">Join Game</button></div><div class="spacer"></div><div class="tagline center">Same friends. Different perspectives.</div></div>`}
const modes=[["imposter","🎭","Imposter","Who got the different question?",false],["who_said","◖","Who Said That?","Who wrote each answer?",true],["predict","◉","Predict Me","Can you predict what they’ll say?",true],["likely","♛","Most Likely To","Who fits the scenario?",true],["double_agent","♟","Double Agent","You know the different question. Blend in.",false],["chaos","⚄","Chaos Mode","All games. No rules.",false]];
function create(){return `${top("Create a Game")}<div class="stack"><div class="field"><label>Your name</label><input id="name" maxlength="24" value="${esc(S.name)}" placeholder="Estelle"></div><div><label>Choose a mode</label><div class="stack" style="margin-top:8px">${modes.map(m=>`<button class="mode ${S.mode===m[0]?'selected':''} ${m[4]?'disabled':''}" ${m[4]?'disabled':''} onclick="S.mode='${m[0]}';render()"><span class="emoji">${m[1]}</span><span><b>${m[2]}</b><small>${m[3]}${m[4]?' · coming next':''}</small></span></button>`).join("")}</div></div><div><label>Vibe</label><div class="pills" style="margin-top:8px">${["chill","juicy","unhinged","everything"].map(v=>`<button class="pill ${S.vibe===v?'selected':''}" onclick="S.vibe='${v}';render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}</div></div><div class="field"><label>Rounds</label><select id="rounds">${[3,5,7,10].map(n=>`<option ${S.rounds===n?'selected':''}>${n}</option>`).join("")}</select></div><button class="btn" onclick="createRoom()">Create Room →</button></div>`}
async function createRoom(){S.name=$("#name").value.trim();S.rounds=Number($("#rounds").value);if(!S.name)return toast("Enter your name first",true);const j=await api({action:"create_room",name:S.name,mode:S.mode,vibe:S.vibe,total_rounds:S.rounds});saveSession(j);S.screen="game";render();poll()}
function join(){return `${top("Join a Game")}<div style="padding-top:40px" class="stack"><h2 class="center">Join a Game</h2><p class="muted center">Enter the room code your friend shared.</p><div class="field"><label>Your name</label><input id="jname" maxlength="24" placeholder="Your name"></div><div class="field"><label>Room code</label><input id="jcode" maxlength="4" autocapitalize="characters" placeholder="7K3P" style="text-transform:uppercase;letter-spacing:.18em;font-weight:700;font-size:22px"></div><button class="btn" onclick="joinRoom()">Join Game →</button></div>`}
async function joinRoom(){const name=$("#jname").value.trim(),code=$("#jcode").value.trim().toUpperCase();if(!name||code.length<4)return toast("Enter your name and 4-character code",true);const j=await api({action:"join_room",name,code});saveSession(j);S.screen="game";render();poll()}
async function refresh(){if(!S.playerToken)return;try{S.state=await api({action:"get_state",player_token:S.playerToken});if(S.screen==="game")render()}catch(e){}}
function poll(){clearInterval(S.timer);refresh();S.timer=setInterval(refresh,1800)}
function amHost(){return !!S.hostToken}
function game(){if(!S.state)return `<div class="wait">Connecting…</div>`;const p=S.state.room.phase;if(p==="lobby")return lobby();if(p==="answering")return answering();if(p==="voting")return voting();if(p==="reveal"||p==="finished")return reveal();return `<div class="wait">Loading game…</div>`}
function lobby(){const r=S.state.room,ps=S.state.players||[];return `${top("Game Lobby")}<div class="stack"><div class="card center"><div class="small muted">ROOM CODE</div><div class="roomcode">${r.code}</div><div class="small muted">Share this code with your friends</div></div><div class="card">${ps.map((p,i)=>`<div class="player"><div class="playerleft"><div class="avatar">${initials(p.name)}</div><div>${esc(p.name)}${i===0?' <span class="small muted">· host</span>':''}</div></div><div class="score">${p.score||0}</div></div>`).join("")}</div><div class="card small"><div><b>Mode:</b> ${r.mode.replace("_"," ")}</div><div style="margin-top:7px"><b>Vibe:</b> ${r.vibe}</div><div style="margin-top:7px"><b>Rounds:</b> ${r.total_rounds}</div></div>${amHost()?`<button class="btn" ${ps.length<3?'disabled':''} onclick="startRound()">${ps.length<3?'Waiting for 3 players…':'Start Game →'}</button>`:`<div class="wait"><div class="dots">•••</div>Waiting for the host to start</div>`}</div>`}
async function startRound(){await api({action:"start_round",host_token:S.hostToken});await refresh()}
function roundHead(){const r=S.state.room;return `<div class="small center muted">Round ${r.current_round} of ${r.total_rounds}</div><div class="progress"><i style="width:${Math.max(8,(r.current_round/r.total_rounds)*100)}%"></i></div>`}
function answering(){const mine=S.state.answers?.some(a=>a.player_id===S.playerId),submitted=S.state.answers?.length||0,total=S.state.players.length;return `${top(S.state.round?.mode==="double_agent"?"Double Agent":"Imposter")}${roundHead()}<div class="mask">${S.state.round?.mode==="double_agent"?"♟":"🎭"}</div><div class="card"><div class="small center muted">YOUR QUESTION</div><div class="question">${esc(S.state.myPrompt||"Loading your question…")}</div></div>${mine?`<div class="wait"><h3>Answer locked in.</h3><p class="muted">${submitted}/${total} players answered.</p><div class="dots">•••</div></div>`:`<div class="stack" style="margin-top:14px"><textarea id="answer" maxlength="280" placeholder="Type your answer…"></textarea><button class="btn" onclick="submitAnswer()">Submit Answer</button></div>`}`}
async function submitAnswer(){const a=$("#answer").value.trim();if(!a)return toast("Write an answer first",true);await api({action:"submit_answer",player_token:S.playerToken,answer:a});await refresh()}
function voting(){const answers=S.state.answers||[],voted=S.state.votes?.some(v=>v.voter_player_id===S.playerId),total=S.state.players.length;return `${top("Discussion & Vote")}${roundHead()}<h2 class="center">Here are the answers.</h2><p class="muted center">Discuss them, then vote for who you think got the different question.</p><div class="card" style="margin-top:18px">${answers.map((a,i)=>`<div class="answer"><div class="who">Answer ${String.fromCharCode(65+i)}</div>${esc(a.answer)}</div>`).join("")}</div>${voted?`<div class="wait"><h3>Vote locked in.</h3><p class="muted">${S.state.votes.length}/${total} players voted.</p><div class="dots">•••</div></div>`:`<h3 style="margin-top:26px" class="center">Who’s the imposter?</h3><div class="votegrid">${S.state.players.filter(p=>p.id!==S.playerId).map(p=>`<button class="votebtn ${S.selectedVote===p.id?'selected':''}" onclick="S.selectedVote='${p.id}';render()"><div class="avatar" style="margin:auto auto 8px">${initials(p.name)}</div>${esc(p.name)}</button>`).join("")}</div><button class="btn" ${!S.selectedVote?'disabled':''} onclick="submitVote()">Submit Vote</button>`}`}
async function submitVote(){if(!S.selectedVote)return;await api({action:"submit_vote",player_token:S.playerToken,target_player_id:S.selectedVote});S.selectedVote=null;await refresh()}
function reveal(){const imp=S.state.players.find(p=>p.id===S.state.imposter),mine=S.state.imposter===S.playerId,finished=S.state.room.phase==="finished",votes=S.state.votes||[],right=votes.filter(v=>v.target_player_id===S.state.imposter).length;return `${top(finished?"Final Reveal":"Reveal")}${roundHead()}<div class="reveal"><div class="eyebrow">${mine?"IT WAS YOU":"THE IMPOSTER WAS…"}</div><div class="bigavatar">${initials(imp?.name)}</div><h2>${esc(imp?.name||"???")}</h2><p class="muted">${right} of ${S.state.players.length} players found them.</p></div><div class="card" style="margin-top:24px"><h3>Scoreboard</h3><div style="margin-top:10px">${[...S.state.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="player"><div class="playerleft"><span>${i+1}.</span><div class="avatar">${initials(p.name)}</div><div>${esc(p.name)}</div></div><div class="score">${p.score}</div></div>`).join("")}</div></div>${finished?`<button class="btn" style="margin-top:14px" onclick="reset()">Back Home</button>`:amHost()?`<button class="btn" style="margin-top:14px" onclick="startRound()">Next Round →</button>`:`<div class="wait"><div class="dots">•••</div>Waiting for the host</div>`}`}
function render(){$("#app").innerHTML=S.screen==="home"?home():S.screen==="create"?create():S.screen==="join"?join():game()}
render();if(S.playerToken){S.screen="game";render();poll()}
</script></body></html>
